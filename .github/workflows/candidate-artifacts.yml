name: candidate-artifacts

# Hosted, SHA-bound release-candidate build for independent QA (FORNX-472).
# Manual only: it never runs on push or pull_request. It is NOT a release: no
# tag, no GitHub release, unsigned, read-only token, 30-day artifact retention.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA to build (defaults to the dispatched ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-artifacts-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build + offline journey
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Pinned action and toolchain, and no shared build cache: this job makes
      # the bytes QA trusts, so two runs of one SHA must not differ by cache.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1

      - name: Build release binaries
        run: cargo build --release --locked -p fornax-cli -p fornax-daemon -p fornax-adapter-claude

      - name: Collect bundle (checksums + provenance)
        id: bundle
        run: |
          set -eu
          out=bundle; mkdir -p "$out/bin"
          for b in fornax fornax-daemon fornax-hook-claude; do cp "target/release/$b" "$out/bin/$b"; done
          sha=$(git rev-parse HEAD)
          {
            echo "# Fornax candidate artifacts - build provenance"
            echo
            echo "- Source: ${GITHUB_REPOSITORY} @ \`$sha\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "- Triggered by: ${GITHUB_ACTOR} via workflow_dispatch"
            echo "- Cargo.lock SHA256: \`$(shasum -a 256 Cargo.lock | cut -d' ' -f1)\`"
            echo "- Toolchain: $(rustc --version) / $(cargo --version)"
            echo "- Runner: $(uname -srm), ${RUNNER_OS:-?}/${RUNNER_ARCH:-?}"
            echo "- Command: \`cargo build --release --locked -p fornax-cli -p fornax-daemon -p fornax-adapter-claude\`"
            echo "- Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Unsigned. Not a release: no tag, no publication. The journey receipt is offline"
            echo "(no model, no real Codex or Claude Code session, no launchctl)."
          } > "$out/PROVENANCE.md"
          cp scripts/candidate-journey.sh "$out/candidate-journey.sh"
          # Last on purpose: the upload only runs once the bundle is complete.
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Offline acceptance journey
        run: bash scripts/candidate-journey.sh bundle/bin bundle/journey-receipt.txt

      - name: Checksums
        if: ${{ !cancelled() }}
        run: |
          set -eu
          [ -d bundle ] || exit 0
          cd bundle
          find . -type f ! -name SHA256SUMS | sed 's|^\./||' | sort | xargs shasum -a 256 > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.bundle.outputs.sha != '' }}
        with:
          name: fornax-candidate-${{ steps.bundle.outputs.sha }}-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30
