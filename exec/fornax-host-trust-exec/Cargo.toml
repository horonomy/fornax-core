[package]
name = "fornax-host-trust-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fornax_host_trust_exec"
path = "src/lib.rs"

[[bin]]
name = "fornax-host-trust-exec"
path = "src/main.rs"

# Test-only stand-in for `codex` used by tests/verify_codex_e2e.rs -- must
# be a real compiled binary, not a shell script (see that file's module
# doc for why). Ships as an ordinary workspace binary; nothing besides
# that one test file ever invokes it.
[[bin]]
name = "fornax-host-trust-exec-fake-codex"
path = "tests/fixtures/fake_codex.rs"

# FORNX-450: lives outside `crates/` for the same structural reason
# `exec/fornax-acquire-exec` (ADR-0022) and `exec/fornax-host-adapter-exec`
# (ADR-0023 D11) do -- so the zero-subprocess scan in
# `crates/fornax-daemon/tests/adversarial_daemon_input.rs` never needs to
# know this crate exists. Unlike `fornax-host-adapter-exec`, this crate DOES
# spawn a process (a sandboxed `codex app-server`, read-only RPC, see
# docs/adr/0026-codex-host-trust-verification.md). Deliberately depends on
# no `fornax-*` crate: this keeps it structurally separate from HORO-1718
# Gate B's native notify/hook-observation work (no shared code), which
# `tests/boundary_invariants.rs` enforces as a dependency allowlist.
[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
