[package]
name = "fornax-acquire-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fornax_acquire_exec"
path = "src/lib.rs"

[[bin]]
name = "fornax-acquire-exec"
path = "src/main.rs"

# FORNX-346 Part 2 / ADR 0022: this crate lives outside `crates/` on
# purpose -- it is the one place in this workspace allowed to spawn a
# subprocess (`RerunTest`) or make an outbound network call
# (`QueryCiStatus`). See `docs/adr/0022-privileged-acquisition-executor.md`.
