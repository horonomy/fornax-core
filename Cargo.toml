[workspace]
resolver = "2"
members = ["crates/fornax-types", "crates/fornax-store", "crates/fornax-verify", "crates/fornax-vcs", "crates/fornax-ci", "crates/fornax-daemon", "crates/fornax-adapter-claude", "crates/fornax-adapter-codex", "crates/fornax-adapter-opencode", "crates/fornax-adapter-conformance", "crates/fornax-cli", "crates/fornax-bench", "crates/fornax-replay", "crates/fornax-experiment-runner", "crates/fornax-corpus", "crates/fornax-acquire", "crates/fornax-receipt", "exec/fornax-acquire-exec"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/horonomy/fornax-core"

[workspace.lints.rust]
# `cargo kani` compiles with `--cfg kani` to select `#[cfg(kani)] mod
# kani_proofs` blocks (FORNX-383) -- registering it here means an ordinary
# `cargo build`/`cargo test`/`cargo clippy` never even attempts those
# modules (unaffected either way) and no longer warns about an "unexpected
# cfg" for a name rustc doesn't otherwise recognize.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["json"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
axum = "0.8"
toml_edit = "0.25"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "3", default-features = false }
base64 = "0.23"
proptest = "1"
