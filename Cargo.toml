[workspace]
resolver = "2"
members = ["crates/fornax-types", "crates/fornax-store", "crates/fornax-verify", "crates/fornax-daemon", "crates/fornax-adapter-claude", "crates/fornax-adapter-codex", "crates/fornax-adapter-opencode", "crates/fornax-adapter-conformance", "crates/fornax-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/horonomy/fornax-core"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = "0.7"
toml_edit = "0.25"
