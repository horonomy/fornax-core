[workspace]
resolver = "2"
members = ["crates/fornax-types", "crates/fornax-store", "crates/fornax-verify", "crates/fornax-vcs", "crates/fornax-ci", "crates/fornax-daemon", "crates/fornax-adapter-claude", "crates/fornax-adapter-codex", "crates/fornax-adapter-opencode", "crates/fornax-adapter-conformance", "crates/fornax-cli", "crates/fornax-upload", "crates/fornax-bench", "crates/fornax-replay", "crates/fornax-experiment-runner", "crates/fornax-corpus", "crates/fornax-acquire", "crates/fornax-receipt", "crates/fornax-protocol", "crates/fornax-protocol-refclient", "crates/fornax-load-harness", "exec/fornax-acquire-exec", "exec/fornax-host-adapter-exec", "exec/fornax-host-trust-exec"]

[workspace.package]
version = "0.0.9"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/horonomy/fornax-core"

[workspace.lints.rust]
# `cargo kani` compiles with `--cfg kani` to select `#[cfg(kani)] mod
# kani_proofs` blocks (FORNX-383) -- registering it here means an ordinary
# `cargo build`/`cargo test`/`cargo clippy` never even attempts those
# modules (unaffected either way) and no longer warns about an "unexpected
# cfg" for a name rustc doesn't otherwise recognize.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["json", "query"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
axum = "0.8"
toml_edit = "0.25"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "3", default-features = false }
base64 = "0.23"
proptest = "1"

# FORNX-495: RUSTSEC-2026-0459 -- libsqlite3-sys < 0.39.0 bundles a vulnerable
# SQLite. No published sqlx release allows libsqlite3-sys >= 0.39 (sqlx-sqlite
# 0.9.0 caps it at < 0.38), and two libsqlite3-sys versions cannot coexist
# (`links = "sqlite3"`), so rusqlite and sqlx must move together. Pin the
# reviewed upstream commit that widens the bound to < 0.40.0
# (launchbadge/sqlx#4502). Review: fornax-evidence/d37f473-qa-handoff/sqlx-pin-review-FORNX-495.md
# Removal condition: delete this section and use the registry release as soon
# as a published sqlx/sqlx-sqlite release allows libsqlite3-sys >= 0.39.
[patch.crates-io]
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-core = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-macros = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-macros-core = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-mysql = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-postgres = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
