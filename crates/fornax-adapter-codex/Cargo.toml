[package]
name = "fornax-adapter-codex"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fornax_adapter_codex"
path = "src/lib.rs"

[[bin]]
name = "fornax-hook-codex"
path = "src/main.rs"

[dependencies]
fornax-types = { path = "../fornax-types" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true

[dev-dependencies]
# HORO-1712: the false-green regression test feeds this adapter's own
# translated Evidence straight into the real TestResultVerifier -- the
# whole point of the test is proving the verifier's *existing* exit_code/
# heuristic logic now resolves Contradicted once this adapter stops
# suppressing the real per-command exit code, not re-deriving that logic
# here. No cycle: fornax-verify does not depend on this crate.
fornax-verify = { path = "../fornax-verify" }
# FORNX-433: live_transport.rs polls the real on-disk store the real
# fornax-daemon it spawns reads/writes, same precedent as
# fornax-adapter-opencode's live_transport.rs.
fornax-store = { path = "../fornax-store" }
