[package]
name = "fornax-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fornax_bench"
path = "src/lib.rs"

[[bin]]
name = "fornax-bench"
path = "src/main.rs"

[dependencies]
fornax-types = { path = "../fornax-types" }
fornax-verify = { path = "../fornax-verify" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
clap.workspace = true
anyhow.workspace = true
chrono.workspace = true
# FORNX-432 PR 1: `independence_capacity`'s stable per-fixture output hash
# (sha2) and its hex rendering (hex) -- both already workspace dependencies
# used the same way by fornax-receipt, not new additions to the workspace.
sha2.workspace = true
hex.workspace = true

[features]
# FORNX-432 PR 1: forwards to `fornax-verify/bench-reference`, enabling
# `independence_capacity::run_fixture`'s cross-check against the frozen
# `build_reference` historical copy. Off by default -- see
# `independence_capacity.rs`'s module docs.
bench-reference = ["fornax-verify/bench-reference"]
