[package]
name = "fornax-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fornax-types = { path = "../fornax-types" }
fornax-store = { path = "../fornax-store" }
fornax-verify = { path = "../fornax-verify" }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
# FORNX-311: background policy bundle poll transport. The workspace
# `reqwest` dependency does not set `default-features = false`, so a
# member-level override of that flag is ignored by Cargo (warns "could
# become a hard error"); `rustls-tls` is added as an extra feature
# alongside the workspace default instead of trying to strip native-tls.
reqwest = { workspace = true, features = ["json", "rustls-tls"] }

[dev-dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
sqlx.workspace = true
