[package]
name = "fornax-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fornax-types = { path = "../fornax-types" }
fornax-store = { path = "../fornax-store" }
fornax-verify = { path = "../fornax-verify" }
fornax-experiment-runner = { path = "../fornax-experiment-runner" }
fornax-acquire = { path = "../fornax-acquire" }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
# FORNX-311: background policy bundle poll transport. The workspace
# `reqwest` dependency does not set `default-features = false`, so a
# member-level override of that flag is ignored by Cargo (warns "could
# become a hard error"); `rustls` is added as an extra feature alongside
# the workspace default instead of trying to strip native-tls. (Feature
# was named `rustls-tls` on reqwest 0.12; renamed to `rustls` on 0.13,
# the version pinned by this workspace.)
reqwest = { workspace = true, features = ["json", "rustls"] }

[dev-dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
sqlx.workspace = true
sha2.workspace = true
hex.workspace = true
